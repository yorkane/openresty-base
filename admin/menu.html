<div id="admin-menu">
  <aside class="menu-shell">
    <div class="brand-row">
      <q-avatar rounded size="32px" class="brand-mark"><q-icon name="mdi-shield-lock-outline" size="20px"></q-icon></q-avatar>
      <strong class="menu-copy brand-label">{{ displayName }}</strong>
      <q-btn flat round dense :icon="toggleIcon" class="collapse-button" :aria-label="toggleLabel" @click="toggleDrawer"><q-tooltip>{{ toggleLabel }}</q-tooltip></q-btn>
    </div>

    <q-list class="menu-list">
      <q-item v-for="item in menuItems" :key="item.app" clickable :active="activeApp === item.app" active-class="menu-item-active" class="menu-item" @click="navigate(item, $event)">
        <q-tooltip v-if="item.address" anchor="top right" self="top left" :offset="[8, 0]">{{ item.address }}</q-tooltip>
        <q-item-section avatar><q-icon :name="item.icon" size="18px"></q-icon></q-item-section>
        <q-item-section class="menu-copy"><span class="menu-item-label">{{ item.label }}</span><span v-if="item.note" class="menu-item-note">{{ item.note }}</span></q-item-section>
        <q-item-section v-if="activeApp === item.app" side class="menu-copy"><span class="active-dot"></span></q-item-section>
      </q-item>
    </q-list>

    <div class="menu-footer-actions">
      <q-btn v-if="authenticated" flat dense stack no-caps icon="mdi-logout-variant" class="footer-action" :aria-label="i18n.logout" @click="logout"><span class="menu-copy footer-label">{{ i18n.logout }}</span></q-btn>
      <q-btn flat dense stack no-caps icon="mdi-translate" class="footer-action" :aria-label="i18n.language" @click="toggleLocale"><span class="menu-copy footer-label">{{ i18n.language }}</span></q-btn>
    </div>
  </aside>
</div>
