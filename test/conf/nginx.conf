worker_processes 1;
error_log /repo/test/logs/error.log warn;
pid       /repo/test/logs/nginx.pid;

events { worker_connections 64; }

http {
    lua_package_path  "/usr/local/openresty/lualib/?.lua;;";
    lua_package_cpath "/usr/local/openresty/lualib/?.so;;";

    server {
        listen 8080;
        server_name localhost;

        # ── 1. Lua 基础 ───────────────────────────────────────────────
        location /hello {
            default_type text/plain;
            content_by_lua_block {
                ngx.say("hello from lua")
                ngx.say("ngx_lua_version=" .. ngx.config.ngx_lua_version)
                ngx.say("openresty_version=" .. ngx.config.nginx_version)
            }
        }

        # ── 2. cjson（内置库）────────────────────────────────────────
        location /json {
            default_type application/json;
            content_by_lua_block {
                local cjson = require "cjson"
                ngx.say(cjson.encode({
                    status  = "ok",
                    module  = "cjson",
                    ts      = ngx.time(),
                }))
            }
        }

        # ── 3. resty.core / ngx.re / resty.lrucache ──────────────────
        location /core {
            default_type text/plain;
            content_by_lua_block {
                local libs = {
                    "resty.core",
                    "ngx.re",
                    "resty.lrucache",
                    "resty.string",
                    "resty.md5",
                }
                for _, name in ipairs(libs) do
                    local ok, err = pcall(require, name)
                    ngx.say(name .. ": " .. (ok and "OK" or ("FAIL - " .. tostring(err))))
                end
            }
        }

        # ── 4. LuaJIT FFI smoke test ──────────────────────────────────
        location /ffi {
            default_type text/plain;
            content_by_lua_block {
                local ffi = require "ffi"
                ffi.cdef[[ int printf(const char *fmt, ...); ]]
                ngx.say("ffi: OK")
                ngx.say("arch: " .. ffi.arch)
                ngx.say("os: "   .. ffi.os)
            }
        }

        # ── 5. FancyIndex 目录浏览 ────────────────────────────────────
        location /files/ {
            alias          /repo/test/html/;
            fancyindex     on;
            fancyindex_exact_size off;
            fancyindex_time_format "%Y-%m-%d %H:%M";
        }

        # ── 6. WebDAV (dav + dav-ext-module) ─────────────────────────
        location /dav/ {
            alias   /repo/test/dav/;
            dav_methods        PUT DELETE MKCOL COPY MOVE;
            dav_ext_methods    PROPFIND OPTIONS LOCK UNLOCK;
            dav_access         user:rw group:rw all:r;
            create_full_put_path on;
            autoindex          on;
        }

        # ── 8. JWT / SSO 公共库 ──────────────────────────────────────
        location /jwt {
            default_type text/plain;
            content_by_lua_block {
                local mods = { "resty.jwt", "resty.jwt-validators", "resty.hmac", "resty.noco_auth" }
                for _, m in ipairs(mods) do
                    local ok, err = pcall(require, m)
                    ngx.say(m .. ": " .. (ok and "OK" or ("FAIL - " .. tostring(err))))
                end

                local noco = require "resty.noco_auth"
                local sso_key = "sso_key"
                local exp = ngx.time() + 3600

                -- HS256 签发并验证往返
                local token, terr = noco.sign(sso_key, { uid = 3, uname = "kate", exp = exp })
                if not token then
                    ngx.say("sign/verify: FAIL - " .. tostring(terr))
                else
                    local payload = noco.verify_token(sso_key, token)
                    if payload and payload.uid == 3 then
                        ngx.say("sign/verify: OK")
                    else
                        ngx.say("sign/verify: FAIL")
                    end
                end

                -- 错误密钥应拒绝
                local bad = noco.verify_token("wrong_key", token or "")
                ngx.say("bad secret: " .. (bad and "accepted!" or "rejected"))

                -- 模拟 APISIX 签发（标准 HS256，RFC 7518 兼容）
                local function b64url(s) return (s:gsub("[+/]", { ["+"] = "-", ["/"] = "_" }):gsub("=+$", "")) end
                local hdr = b64url(ngx.encode_base64('{"typ":"JWT","alg":"HS256"}'))
                local pay = b64url(ngx.encode_base64('{"uid":3,"uname":"kate","exp":' .. exp .. '}'))
                local msg = hdr .. "." .. pay
                local mac = (require "resty.hmac"):new(sso_key, (require "resty.hmac").ALGOS.SHA256)
                local sig = b64url(ngx.encode_base64(mac:final(msg)))
                local apisix_token = msg .. "." .. sig
                local ap = noco.verify_token(sso_key, apisix_token)
                ngx.say("apisix-style token: " .. (ap and ("OK uid=" .. ap.uid) or "FAIL"))

                -- noco_uid 解析
                local info = noco.parse_noco_uid("req123-07170000-kate")
                ngx.say("noco_uid: " .. (info and (info.state .. "/" .. info.uname) or "FAIL"))
            }
        }
    }
}
